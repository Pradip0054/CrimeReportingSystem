services:
  db:                       # 2 spaces indent
    image: mysql:8.0        # 4 spaces indent
    container_name: crime_db
    restart: always 
    environment:
      MYSQL_DATABASE: crime_reporting
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crime_network

  laravel:                  # 2 spaces indent
    build: ./backend
    container_name: crime_laravel
    ports:
      - "8000:8000" 
    volumes:
      - ./backend:/var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
    networks:
      - crime_network

  ai_service:               # 2 spaces indent
    build: ./ai_service
    container_name: crime_ai
    tty: true 
    stdin_open: true 
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app
    depends_on:
      - db
    networks:
      - crime_network

  frontend:                 # 2 spaces indent
    build: ./frontend
    container_name: crime_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - laravel
      - ai_service
    networks:
      - crime_network

networks:                   # No indent (Top level)
  crime_network:
    driver: bridge

volumes:                    # No indent (Top level)
  db_data: